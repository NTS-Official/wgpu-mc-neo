# Done to increase the memory available to gradle.
# NeoGradle runs Vineflower decompilation in-process-adjacent worker JVMs sized from
# this value, and the 26.1 merged jar needs more than the old 1G/2G default.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# NeoForge Properties
# The Minecraft, NeoForge and mod versions used to be here, because this build used to build the
# mod as well. They went with the mod: the Neolectrum repository's own `gradle.properties` is what
# stamps a jar and its `neoforge.mods.toml`, and this repository's `packaging` test reads them from
# there - one copy of a version number is one thing to forget to bump.
