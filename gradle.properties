# Done to increase the memory available to gradle.
# NeoGradle runs Vineflower decompilation in-process-adjacent worker JVMs sized from
# this value, and the 26.1 merged jar needs more than the old 1G/2G default.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# NeoForge Properties
# Minecraft 26.1 is unobfuscated, so no mappings/parchment entries are needed anymore.
# NeoForge switched to four-part versions (<minecraft>-<hotfix>.<release>) in 26.1.
# 26.1.2.109, as known as the Minecraft 26.1 hotfix 2, NeoForge release 109 (latest stable 26.1 line).
neoforge_minecraft_version=26.1
neoforge_neo_version=26.1.2.109
neoforge_neo_gradle_version=7.1.21
neoforge_mod_version=2612.0.8-beta
neoforge_maven_group=dev.birb
